name: Visual Tests

on:
  push:
    branches: [master]
    paths: ['voxellaneous-web/**']
  pull_request:
    branches: [master]
    paths: ['voxellaneous-web/**']

defaults:
  run:
    working-directory: voxellaneous-web

jobs:
  visual-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: voxellaneous-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install common module dependencies
        run: cd ../voxellaneous-common && npm install

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # xvfb provides a virtual display for headed Chromium (WebGPU needs it)
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # CI uses SwiftShader (software WebGPU) which can't produce correct
      # renders for this pipeline (sky atmosphere, compute shaders, deferred
      # lighting).  We run tests in smoke-test mode: verify harness loads,
      # WebGPU inits, scenarios execute, and no JS errors — but skip pixel
      # comparison.  Screenshots are uploaded as artifacts for manual review.
      - name: Run visual tests (smoke)
        run: xvfb-run --auto-servernum npm run test:ci

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-screenshots
          path: voxellaneous-web/tests/ci-screenshots/
          retention-days: 14

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-results
          path: |
            voxellaneous-web/tests/output/
            voxellaneous-web/test-results/
          retention-days: 14
