name: Visual Tests

on:
  push:
    branches: [master]
    paths: ['voxellaneous-web/**']
  pull_request:
    branches: [master]
    paths: ['voxellaneous-web/**']

defaults:
  run:
    working-directory: voxellaneous-web

jobs:
  visual-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: voxellaneous-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install common module dependencies
        run: cd ../voxellaneous-common && npm install

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # xvfb provides a virtual display for headed Chromium (WebGPU needs it)
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run visual tests
        run: xvfb-run --auto-servernum npm run test

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-results
          path: |
            voxellaneous-web/tests/output/
            voxellaneous-web/test-results/
          retention-days: 14
