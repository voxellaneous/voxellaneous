syntax = "proto3";

package voxellaneous.net;

message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message Quaternion {
  float x = 1;
  float y = 2;
  float z = 3;
  float w = 4;
}

message UserCmd {
  bool forward = 1;
  bool backward = 2;
  bool left = 3;
  bool right = 4;
  bool jump = 5;
  bool descend = 6;
  Vector3 view_dir = 7;
}

message UserCmdPacket {
  uint32 sequence = 1;
  UserCmd cmd = 2;
}

message EntityState {
  uint32 id = 1;
  Vector3 position = 2;
  Vector3 velocity = 3;
  Quaternion rotation = 4;
}

message WorldSnapshot {
  double timestamp = 1;
  uint32 sequence = 2;
  uint32 last_processed_input_seq = 3;
  repeated EntityState entities = 4;
}

message SnapshotDelta {
  double timestamp = 1;
  uint32 sequence = 2;
  uint32 last_processed_input_seq = 3;
  uint32 base_sequence = 4;
  repeated EntityState entities = 5;
  repeated uint32 removed_ids = 6;
}

message NetMessage {
  oneof payload {
    WorldSnapshot snapshot = 1;
    SnapshotDelta delta = 2;
  }
}
